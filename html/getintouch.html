<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact CityRide | Bike rentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    
  
    <nav class="navbar bg-body-tertiary sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="demo.html">
          <img src="../img/logo.png" alt="CityRide logo" width="100" height="60" class="me-2">
          <span>CityRide</span>
        </a>

        <ul class="nav nav-pills">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Get In Touch</a></li>
          <li class="nav-item"><a class="nav-link" href="aboutUs.html">About Us</a></li>
        </ul>
      </div>
    </nav>

 
    <section class="py-5">
      <div class="container">
        <div class="row">
       
          <div class="col-lg-5 mb-4">
            <h2>Contact Us</h2>
            <p>Have questions or need a bike? Reach out to us and we’ll get back to you promptly!</p>
            <ul class="list-unstyled">
              <li><strong>Phone:</strong> +91 7870277160</li>
              <li><strong>Email:</strong> em@rentbikex.com</li>
            </ul>
          </div>

       
          <div class="col-lg-7">
            <form id="contact-form">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Write your message"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Message</button>
              <p id="contact-status" class="mt-3" role="status"></p>
            </form>
          </div>
        </div>
      </div>
    </section>

      <footer class="bg-dark text-white text-center py-1">
  <div class="container">
    <p class="mb-2">© 2026 CityRide</p>

    <p class="mb-0">
      <a href="#" class="text-white mx-2"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="text-white mx-2"><i class="fab fa-twitter"></i></a>
      <a href="#" class="text-white mx-2"><i class="fab fa-instagram"></i></a>
    </p>
  </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.querySelector('#contact-form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.querySelector('#contact-status').textContent = 'Thanks. Your message is ready for the CityRide team.';
        event.target.reset();
      });
    </script>
  </body>
</html>
